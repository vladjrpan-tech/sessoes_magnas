<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sessões Magnas — 22ª Região Maçônica</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --dark:#08111C;
  --navy:#1A2E4A;
  --navy-glass:rgba(26,46,74,0.55);
  --navy-mid:#2D4A6E;
  --gold:#C9A84C;
  --gold-bright:#E2BE6E;
  --gold-dim:#9A7A38;
  --gold-glow:rgba(201,168,76,0.35);
  --parchment:#F0EAD6;
  --text-dim:#7A9BB8;
  --text-mid:#9BB5CC;
  --border-glass:rgba(201,168,76,0.12);
  --border-hover:rgba(201,168,76,0.28);

  --c-iniciacao:#C9A84C;
  --c-elevacao:#2DD4BF;
  --c-exaltacao:#A78BFA;
  --c-outorga:#60A5FA;
  --c-passagem:#FB923C;
  --c-palestra:#4ADE80;
  --c-branca:#CBD5E1;
}

html,body{height:100%;overflow:hidden}
body{
  background:var(--dark);
  font-family:"Inter",sans-serif;
  color:var(--parchment);
}

/* ══════════════════════════════════════
   ANIMATED BACKGROUND
══════════════════════════════════════ */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%,rgba(201,168,76,.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%,rgba(45,74,110,.4) 0%,transparent 60%),
    var(--dark);
  overflow:hidden;
}
.bg-geo{
  position:absolute;inset:0;
  background-image:
    url("data:image/svg+xml,%3Csvg%20width='84'%20height='150'%20viewBox='0%200%2056%20100'%20xmlns='http://www.w3.org/2000/svg'%3E%3Cpath%20d='M28%2066L0%2050L0%2016L28%200L56%2016L56%2050L28%2066L28%20100'%20fill='none'%20stroke='rgba(201,168,76,0.32)'%20stroke-width='1.4'/%3E%3Cpath%20d='M28%200L28%2034L0%2050L0%2084L28%20100L56%2084L56%2050L28%2034'%20fill='none'%20stroke='rgba(201,168,76,0.32)'%20stroke-width='1.4'/%3E%3C/svg%3E");
  background-size:84px 150px;
  opacity:1;
  animation:bgShift 50s linear infinite;
}
@keyframes bgShift{from{background-position:0 0}to{background-position:84px 150px}}

.bg-emblem{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
  opacity:.09;
  pointer-events:none;
  animation:emblemGlow 6s ease-in-out infinite;
}
.bg-emblem svg{
  width:min(78vw,560px);
  height:min(78vw,560px);
}
@keyframes emblemGlow{
  0%,100%{opacity:.07}
  50%{opacity:.13}
}

.orb{
  position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;
  animation:orbFloat 12s ease-in-out infinite alternate;
}
.orb1{width:300px;height:300px;background:rgba(201,168,76,.05);top:-80px;left:-80px;animation-duration:14s}
.orb2{width:250px;height:250px;background:rgba(45,74,110,.18);bottom:-60px;right:-60px;animation-duration:18s;animation-delay:-6s}
.orb3{width:180px;height:180px;background:rgba(201,168,76,.04);top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:10s;animation-delay:-3s}
@keyframes orbFloat{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(30px,20px) scale(1.1)}
}

/* ══════════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════════ */
.app{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
.header{
  flex-shrink:0;
  padding:env(safe-area-inset-top,0px) 16px 0;
  background:linear-gradient(180deg,rgba(8,17,28,.98) 0%,rgba(8,17,28,.85) 100%);
  border-bottom:1px solid var(--border-glass);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.header-inner{
  display:flex;align-items:center;gap:14px;
  padding:12px 0 14px;
}
.logo-wrap{
  position:relative;flex-shrink:0;
}
.logo{
  width:76px;height:76px;
  object-fit:contain;
  filter:drop-shadow(0 0 16px rgba(201,168,76,.55));
  animation:logoPulse 4s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 10px rgba(201,168,76,.4))}
  50%{filter:drop-shadow(0 0 22px rgba(201,168,76,.7))}
}
.header-text{flex:1;min-width:0}
.glesp{
  font-family:"Cinzel",serif;font-size:8.5px;letter-spacing:.25em;
  color:var(--gold-dim);text-transform:uppercase;
}
.title{
  font-family:"Cinzel",serif;font-size:17px;font-weight:700;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold-bright) 50%,var(--gold) 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 4s linear infinite;
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@keyframes shimmer{
  0%{background-position:0% center}
  100%{background-position:200% center}
}
.subtitle{font-size:9.5px;color:var(--text-dim);letter-spacing:.05em;margin-top:1px}
.btn-refresh{
  flex-shrink:0;width:36px;height:36px;
  background:rgba(201,168,76,.08);
  border:1px solid rgba(201,168,76,.18);
  border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-dim);font-size:17px;
  transition:all .2s;
}
.btn-refresh:hover{background:rgba(201,168,76,.18);border-color:rgba(201,168,76,.4);color:var(--gold)}
.btn-refresh.spinning{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════
   DATE NAV
══════════════════════════════════════ */
.date-nav{
  flex-shrink:0;
  display:flex;gap:8px;overflow-x:auto;
  padding:10px 14px 10px;
  background:rgba(8,17,28,.6);
  border-bottom:1px solid rgba(255,255,255,.04);
  scrollbar-width:none;
}
.date-nav::-webkit-scrollbar{display:none}
.date-pill{
  flex-shrink:0;position:relative;
  font-size:12px;font-weight:500;color:var(--text-dim);
  padding:6px 16px;border-radius:24px;cursor:pointer;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(26,46,74,.4);
  transition:all .2s;white-space:nowrap;
  overflow:hidden;
}
.date-pill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,168,76,.15) 0%,transparent 60%);
  opacity:0;transition:opacity .2s;
}
.date-pill:hover{border-color:rgba(201,168,76,.3);color:var(--parchment)}
.date-pill:hover::after{opacity:1}
.date-pill.active{
  background:linear-gradient(135deg,rgba(201,168,76,.25),rgba(201,168,76,.1));
  border-color:rgba(201,168,76,.5);color:var(--gold);font-weight:600;
  box-shadow:0 0 16px rgba(201,168,76,.2),inset 0 1px 0 rgba(255,255,255,.1);
}
.date-pill.active::after{opacity:1}

.date-pill.is-next{
  border-color:rgba(74,222,128,.45);
}
.date-pill.is-next:not(.active){
  color:#8be6a8;
}
.next-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#4ADE80;margin-left:6px;
  box-shadow:0 0 6px #4ADE80;
  animation:nextDotPulse 1.6s ease-in-out infinite;
  vertical-align:middle;
}
@keyframes nextDotPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(1.4)}
}

/* ══════════════════════════════════════
   DATE HEADER STRIP
══════════════════════════════════════ */
.date-strip{
  flex-shrink:0;
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(26,46,74,.25);
  border-bottom:1px solid rgba(201,168,76,.07);
  flex-wrap:wrap;row-gap:6px;
}
.date-strip-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:6px}
.date-day{
  font-family:"Cinzel",serif;font-size:13px;font-weight:600;
  color:var(--gold);letter-spacing:.04em;
}
.date-full{font-size:12px;color:var(--text-mid)}
.next-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:"Cinzel",serif;font-size:9.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:#0F1E30;
  background:linear-gradient(135deg,#4ADE80,#2DD4BF);
  padding:4px 11px;border-radius:20px;
  box-shadow:0 0 12px rgba(74,222,128,.4);
  animation:nextBadgePulse 2.2s ease-in-out infinite;
}
@keyframes nextBadgePulse{
  0%,100%{box-shadow:0 0 10px rgba(74,222,128,.35)}
  50%{box-shadow:0 0 18px rgba(74,222,128,.6)}
}
.date-count{
  font-size:10px;color:var(--text-dim);
  background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);
  padding:2px 10px;border-radius:20px;
  font-family:"Cinzel",serif;letter-spacing:.06em;
}

/* ══════════════════════════════════════
   CARD LIST
══════════════════════════════════════ */
.card-list{
  flex:1;overflow-y:auto;
  padding:10px 12px 16px;
  display:flex;flex-direction:column;gap:10px;
  overscroll-behavior:contain;
}
.card-list::-webkit-scrollbar{width:3px}
.card-list::-webkit-scrollbar-track{background:transparent}
.card-list::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:2px}

/* ══════════════════════════════════════
   SESSION CARD
══════════════════════════════════════ */
.s-card{
  position:relative;overflow:hidden;
  background:var(--navy-glass);
  border:1px solid var(--border-glass);
  border-radius:14px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:transform .2s,box-shadow .2s,border-color .2s;
  animation:cardIn .35s both;
}
.s-card:hover{
  transform:translateY(-2px);
  border-color:var(--border-hover);
  box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 1px var(--accent-glow,rgba(201,168,76,.2));
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

/* Glow strip on left */
.s-card-glow{
  position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--accent-color,var(--gold));
  box-shadow:0 0 12px var(--accent-glow,rgba(201,168,76,.6));
}
/* Top glow line */
.s-card::before{
  content:"";position:absolute;top:0;left:4px;right:0;height:1px;
  background:linear-gradient(90deg,var(--accent-color,var(--gold)),transparent 60%);
  opacity:.4;
}

.s-card-body{
  display:grid;grid-template-columns:48px 1fr auto;
  gap:12px;padding:13px 14px 11px 16px;align-items:start;
}
.s-num{
  font-family:"Cinzel",serif;font-size:20px;font-weight:900;
  color:var(--accent-color,var(--gold));
  text-align:center;line-height:1;
  text-shadow:0 0 16px var(--accent-glow,rgba(201,168,76,.5));
}
.s-info{min-width:0}
.s-name{
  font-size:13px;font-weight:600;color:var(--parchment);
  line-height:1.3;
}
.s-city{
  font-size:10px;color:var(--text-dim);margin-top:2px;
  display:flex;align-items:center;gap:4px;
}
.s-city::before{content:"📍";font-size:9px}
.s-irmao{
  font-size:11.5px;color:var(--text-mid);margin-top:5px;
  line-height:1.35;font-style:italic;
}
.s-hora-wrap{text-align:right;flex-shrink:0}
.s-hora{
  font-family:"Cinzel",serif;font-size:16px;font-weight:700;
  color:var(--accent-color,var(--gold));
  text-shadow:0 0 10px var(--accent-glow,rgba(201,168,76,.4));
}
.s-hora-label{font-size:8px;color:var(--text-dim);letter-spacing:.06em;margin-top:2px}

.s-card-foot{
  margin:0 14px 12px 16px;
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.s-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent-color,var(--gold));
  background:rgba(255,255,255,.06);
  border:1px solid var(--accent-color,var(--gold));
  border-radius:20px;padding:3px 10px;
  box-shadow:0 0 8px var(--accent-glow,rgba(201,168,76,.25));
  flex-shrink:0;
}
.s-badge::before{
  content:"";display:block;width:5px;height:5px;border-radius:50%;
  background:var(--accent-color,var(--gold));
  box-shadow:0 0 5px var(--accent-color,var(--gold));
}
.s-sessao{
  font-size:11px;color:var(--text-mid);line-height:1.35;flex:1;min-width:0;
}

/* Empty state */
.empty{
  text-align:center;padding:48px 24px;
  color:var(--text-dim);line-height:1.7;
}
.empty-icon{font-size:36px;display:block;margin-bottom:12px;opacity:.5}

/* ══════════════════════════════════════
   FOOTER
══════════════════════════════════════ */
.footer{
  flex-shrink:0;
  padding:8px 16px env(safe-area-inset-bottom,0px);
  background:rgba(8,17,28,.9);
  border-top:1px solid var(--border-glass);
  display:flex;justify-content:space-between;align-items:center;
  backdrop-filter:blur(12px);
}
.footer-motto{
  font-family:"Cinzel",serif;font-size:9.5px;
  color:var(--gold-dim);letter-spacing:.1em;
}
.footer-ts{font-size:9px;color:rgba(255,255,255,.2)}

/* ══════════════════════════════════════
   LEGEND (desktop)
══════════════════════════════════════ */
.legend{
  display:none;flex-shrink:0;
  gap:10px;flex-wrap:wrap;
  padding:8px 16px;
  border-top:1px solid rgba(255,255,255,.04);
  background:rgba(8,17,28,.5);
}
.legend-item{
  display:flex;align-items:center;gap:5px;
  font-size:10px;color:var(--text-dim);
}
.legend-dot{
  width:7px;height:7px;border-radius:50%;
  box-shadow:0 0 5px currentColor;
}

/* ══════════════════════════════════════
   DESKTOP OVERRIDES  ≥ 640px
══════════════════════════════════════ */
@media(min-width:640px){
  .app{
    align-items:center;
    padding:24px 24px 0;
    overflow-y:auto;
    overflow-x:hidden;
    background:transparent;
  }
  .app::-webkit-scrollbar{display:none}
  .card-shell{
    width:100%;max-width:680px;
    display:flex;flex-direction:column;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(201,168,76,.12);
    margin-bottom:24px;
  }
  .header{padding-top:0}
  .logo{width:92px;height:92px}
  .title{font-size:20px}
  .date-pill{font-size:13px;padding:7px 18px}
  .s-num{font-size:24px}
  .s-name{font-size:14px}
  .s-hora{font-size:18px}
  .s-badge{font-size:10px}
  .s-sessao{font-size:12px}
  .legend{display:flex}
  body{overflow:auto}
  html,body{height:auto}
}
</style>
</head>

  {key:"Exaltação",  color:"#A78BFA", glow:"rgba(167,139,250,0.4)"},
  {key:"Outorga",    color:"#60A5FA", glow:"rgba(96,165,250,0.4)"},
  {key:"Passage",    color:"#FB923C", glow:"rgba(251,146,60,0.4)"},
  {key:"Passagem",   color:"#FB923C", glow:"rgba(251,146,60,0.4)"},
  {key:"Palestra",   color:"#4ADE80", glow:"rgba(74,222,128,0.4)"},
  {key:"Branca",     color:"#CBD5E1", glow:"rgba(203,213,225,0.35)"},
];

function sessionInfo(sessao) {
  const s = sessao || "";
  for (const t of SESSION_TYPES) {
    if (s.toLowerCase().includes(t.key.toLowerCase())) return t;
  }
  const label = s.replace(/Sess[aã]o Magna (de |do |da )?/i,"").split(" - ")[0].trim() || "Sessão";
  return {color:"#C9A84C", glow:"rgba(201,168,76,0.4)", key:label};
}

let agenda = {};

function csvParse(text) {
  return text.split(/\r?\n/).map(line => {
    const row = []; let cur = ""; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { row.push(cur.trim()); cur = ""; }
      else { cur += c; }
    }
    row.push(cur.trim()); return row;
  });
}

function normDate(raw) {
  if (!raw) return null;
  const m = raw.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-]\d{2,4})?$/);
  if (!m) return "A DEFINIR";
  return m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0");
}

function toComparableDate(d) {
  if (!d || d === "A DEFINIR") return null;
  const [dd,mm] = d.split("/").map(Number);
  const now = new Date();
  let year = now.getFullYear();
  let dt = new Date(year, mm-1, dd);
  // If this date looks more than ~half a year in the past, assume it belongs to next year
  if ((dt - now) / 86400000 < -180) dt = new Date(year+1, mm-1, dd);
  return dt;
}

function sortDates() {
  return Object.keys(agenda).sort((a,b) => {
    if (a==="A DEFINIR") return 1; if (b==="A DEFINIR") return -1;
    return toComparableDate(a) - toComparableDate(b);
  });
}

function getNextDate() {
  const dates = sortDates();
  const today = new Date(); today.setHours(0,0,0,0);
  let best = null, bestDiff = Infinity;
  dates.forEach(d => {
    const dt = toComparableDate(d);
    if (!dt) return;
    dt.setHours(0,0,0,0);
    const diff = dt - today;
    if (diff >= 0 && diff < bestDiff) { bestDiff = diff; best = d; }
  });
  if (best) return best;
  // all dated entries are in the past — fall back to the most recent one, or "A DEFINIR"
  const dated = dates.filter(d => d !== "A DEFINIR");
  return dated.length ? dated[dated.length-1] : (dates[0] || null);
}

function cardHTML(l, i) {
  const si = sessionInfo(l.sessao);
  const delay = (i * 60) + "ms";
  return `<div class="s-card" style="--accent-color:${si.color};--accent-glow:${si.glow};animation-delay:${delay}">
    <div class="s-card-glow"></div>
    <div class="s-card-body">
      <div class="s-num">${l.num}</div>
      <div class="s-info">
        <div class="s-name">${l.nome}</div>
        <div class="s-city">${l.cidade}</div>
        ${l.irmao ? `<div class="s-irmao">${l.irmao}</div>` : ""}
      </div>
      <div class="s-hora-wrap">
        <div class="s-hora">${l.hora}</div>
        <div class="s-hora-label">HORA</div>
      </div>
    </div>
    <div class="s-card-foot">
      <span class="s-badge">${si.key}</span>
      <span class="s-sessao">${l.sessao}</span>
    </div>
  </div>`;
}

function showDay(date) {
  document.querySelectorAll(".date-pill").forEach(b => {
    b.classList.toggle("active", b.dataset.d === date);
    if (b.dataset.d === date) b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  });

  const d = agenda[date]; if (!d) return;
  const DAYS = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];

  let dayStr = "", fullStr = "";
  if (date === "A DEFINIR") {
    dayStr = "A Definir"; fullStr = "Data não definida";
  } else {
    const [dd,mm] = date.split("/");
    const dt = new Date(new Date().getFullYear(), parseInt(mm)-1, parseInt(dd));
    dayStr = DAYS[dt.getDay()];
    fullStr = parseInt(dd) + " de " + (MES[mm]||mm);
  }

  const ct = d.lojas.length + (d.lojas.length === 1 ? " sessão" : " sessões");
  setText("date-day", dayStr);
  setText("date-full", fullStr);
  setText("date-count", ct);
  document.getElementById("card-list").innerHTML = d.lojas.map((l,i) => cardHTML(l,i)).join("");

  const badge = document.getElementById("next-badge");
  if (badge) badge.style.display = (date === getNextDate()) ? "inline-flex" : "none";
}

function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=v}

function buildPills() {
  const dates = sortDates();
  const next = getNextDate();
  const nav = document.getElementById("date-nav");
  nav.innerHTML = "";
  dates.forEach(d => {
    const b = document.createElement("button");
    b.className = "date-pill" + (d === next ? " is-next" : "");
    b.textContent = d === "A DEFINIR" ? "A Definir" : d;
    b.dataset.d = d;
    b.onclick = () => showDay(d);
    if (d === next) {
      const dot = document.createElement("span");
      dot.className = "next-dot";
      b.appendChild(dot);
    }
    nav.appendChild(b);
  });
}

function buildLegend() {
  const used = {};
  Object.values(agenda).forEach(d => d.lojas.forEach(l => {
    const si = sessionInfo(l.sessao);
    used[si.key] = si.color;
  }));
  const lg = document.getElementById("legend");
  if (!lg) return;
  lg.innerHTML = Object.entries(used).map(([label, color]) =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${color};color:${color}"></div>
      <span>${label}</span>
    </div>`
  ).join("");
}

function autoSelect() {
  const next = getNextDate();
  if (next) showDay(next);
}

async function reload() {
  const btn = document.getElementById("btn-refresh");
  if (btn) btn.classList.add("spinning");
  try {
    const resp = await fetch(CSV + "&_t=" + Date.now());
    if (!resp.ok) throw new Error(resp.status);
    const rows = csvParse(await resp.text());
    agenda = {};
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.length < 6) continue;
      const num    = (r[0]||"").replace(/\D/g,"");
      const nome   = r[1]||"";
      const cidade = r[2]||"";
      const sessao = (r[3]||"").trim();
      const irmao  = (r[4]||"").trim();
      const data   = normDate(r[5]);
      const hora   = (r[6]||"20h00").trim();
      if (!data || !num) continue;
      if (!agenda[data]) agenda[data] = {lojas:[]};
      agenda[data].lojas.push({num,nome,cidade,sessao,irmao,hora});
    }
    buildPills(); buildLegend(); autoSelect();
    const ts = new Date();
    setText("footer-ts", ts.getHours()+":"+String(ts.getMinutes()).padStart(2,"0"));
  } catch(e) {
    const el = document.getElementById("card-list");
    if (el) el.innerHTML = `<div class="empty"><span class="empty-icon">⚠️</span>Erro ao carregar dados.<br><small>Verifique sua conexão e tente novamente.</small></div>`;
  } finally {
    if (btn) btn.classList.remove("spinning");
  }
}

// Desktop: wrap content in a card-shell
function wrapDesktop() {
  if (window.innerWidth >= 640) {
    let shell = document.getElementById("card-shell");
    if (!shell) {
      shell = document.createElement("div");
      shell.id = "card-shell";
      shell.className = "card-shell";
      const app = document.getElementById("app");
      // move children into shell (except bg)
      [...app.children].forEach(c => shell.appendChild(c));
      app.appendChild(shell);
    }
  }
}

window.addEventListener("DOMContentLoaded", () => {
  reload();
  if (window.innerWidth >= 640) wrapDesktop();
});
</script>
